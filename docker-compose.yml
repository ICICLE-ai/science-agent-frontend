services:
  frontend:
    image: node:26.0.0-bookworm-slim
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL-http://localhost:8000}
      VITE_STATIC_FILE_BASE_URL: ${VITE_STATIC_FILE_BASE_URL:-storage}
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./tailwind.config.js:/app/tailwind.config.js:ro
      - ./postcss.config.js:/app/postcss.config.js:ro
      - frontend-dependencies:/app/node_modules
      - frontend-server:/opt/static-server
    command:
      - /bin/sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        npm run build
        npm install --prefix /opt/static-server --no-audit --no-fund serve@14.2.4
        exec node /opt/static-server/node_modules/serve/build/main.js -s dist -l tcp://0.0.0.0:3000
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  frontend-dependencies:
  frontend-server:
